<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Hydra board</title>
<style nonce="__CSP_NONCE__">
:root { --bg:#0e1116; --card:#171c26; --line:#2b3346; --fg:#d6deeb; --dim:#8b95a8; --accent:#6ea8fe; --warn:#e8a33d; --good:#4cb58a; --bad:#e0645c; --code:#0b0e13; }
@media (prefers-color-scheme: light) {
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --fg:#1b1f27; --dim:#667085; --accent:#2563eb; --warn:#b7791f; --good:#1f9d6a; --bad:#c0392b; --code:#f0f2f5; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; }
header { display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem; border-bottom: 1px solid var(--line); }
header h1 { font-size: 1rem; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button, select, input { font: inherit; color: var(--fg); }
button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .35rem .75rem; cursor: pointer; }
select, input[type=search] { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .3rem .5rem; }
.filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem .9rem 0; align-items: center; }
.chip { font-size: .78rem; padding: .2rem .65rem; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); cursor: pointer; background: none; }
.chip.on { color: var(--fg); border-color: var(--accent); }
.filters input[type=search] { flex: 1; min-width: 8rem; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding-bottom: 1rem; }
h2 { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 1rem .9rem .4rem; display: flex; gap: .5rem; align-items: center; }
h2 .n { background: var(--warn); color: #000; border-radius: 99px; padding: 0 .5rem; font-weight: 700; }
h2 .n.w { background: var(--accent); }
h2 .n.z { background: var(--line); color: var(--dim); }
h2 .n.i { background: none; color: var(--dim); font-weight: 400; padding: 0; }
.cols { display: block; }
@media (min-width: 900px) {
  .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .7fr); gap: 1rem; padding: 0 1rem; align-items: start; }
  .cols h2 { margin-left: 0; margin-right: 0; }
  .cols .card { margin-left: 0; margin-right: 0; }
  .cols .idle { padding-left: 0; padding-right: 0; }
}
.card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: .5rem .9rem; padding: .7rem .8rem; cursor: pointer; }
.card.need { border-color: var(--warn); }
.top { display: flex; justify-content: space-between; gap: .5rem; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--dim); font-size: .8rem; }
.host { color: var(--accent); font-size: .75rem; margin-left: .4rem; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: .4rem; background: var(--accent); }
.req { margin: .55rem 0; padding: .5rem .6rem; background: var(--code); border-radius: 6px; font: 12.5px/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.req b { color: var(--warn); }
.btns { display: flex; gap: .5rem; margin-top: .5rem; }
.btns button { flex: 1; font-weight: 600; padding: .5rem; }
.btns .ok { background: var(--good); color: #04130c; border-color: var(--good); }
.btns .no { color: var(--bad); }
.btns .alt { color: var(--dim); }
.note { color: var(--dim); font-size: .85rem; }
.idle { display: flex; justify-content: space-between; gap: .5rem; padding: .45rem .9rem; color: var(--dim); font-size: .88rem; border-bottom: 1px solid var(--line); cursor: pointer; }
.idle span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more { margin: .6rem .9rem; }
.empty { color: var(--dim); padding: .4rem .9rem; font-size: .88rem; }
.msg { margin: .6rem .9rem; padding: .5rem .7rem; border-radius: 8px; background: var(--card); overflow-wrap: anywhere; }
.msg.user { background: var(--accent); color: #fff; margin-left: 3rem; }
.msg.error { color: var(--bad); }
.msg pre { overflow-x: auto; }
.perm { border: 1px solid var(--warn); border-radius: 8px; padding: .6rem; margin: .6rem .9rem; }
footer { display: flex; gap: .5rem; padding: .6rem .9rem; border-top: 1px solid var(--line); padding-bottom: max(.6rem, env(safe-area-inset-bottom)); }
textarea { flex: 1; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .6rem; resize: none; min-height: 2.6rem; max-height: 8rem; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.chatwrap { max-width: 52rem; margin: 0 auto; width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script nonce="__CSP_NONCE__">/*BUNDLE*/</script>
</body>
</html>
