<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hydra (min)</title>
<style nonce="__CSP_NONCE__">
:root { --bg: #fff; --fg: #1b1f27; --dim: #6b7280; --line: #d9dde3; --card: #f4f6f9; --accent: #2563eb; --bad: #c0392b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1116; --fg: #d6deeb; --dim: #8b95a8; --line: #2b3346; --card: #171c26; --accent: #6ea8fe; --bad: #f06060; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 48rem; margin: 0 auto; }
header { display: flex; gap: .5rem; align-items: center; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
header h1 { font-size: 1rem; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button, a.btn { font: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: .35rem .7rem; cursor: pointer; text-decoration: none; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: .5rem .8rem; }
.row { padding: .6rem .5rem; border-bottom: 1px solid var(--line); cursor: pointer; }
.row .sub { color: var(--dim); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.cold { opacity: .55; }
.badge { font-size: .75rem; color: var(--accent); margin-left: .4rem; }
.msg { margin: .6rem 0; padding: .5rem .7rem; border-radius: 8px; background: var(--card); overflow-wrap: anywhere; }
.msg.user { background: var(--accent); color: #fff; margin-left: 2rem; }
.msg.error { color: var(--bad); }
.msg pre { overflow-x: auto; }
.note { color: var(--dim); font-size: .85rem; margin: .4rem 0; }
.perm { border: 1px solid var(--accent); border-radius: 8px; padding: .6rem; margin: .6rem 0; }
.perm button { margin: .3rem .3rem 0 0; }
footer { display: flex; gap: .5rem; padding: .6rem .8rem; border-top: 1px solid var(--line); padding-bottom: max(.6rem, env(safe-area-inset-bottom)); }
textarea { flex: 1; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem; resize: none; min-height: 2.6rem; max-height: 8rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script nonce="__CSP_NONCE__">/*BUNDLE*/</script>
</body>
</html>
